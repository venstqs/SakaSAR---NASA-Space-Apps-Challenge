pilot_name: "bicol_kristine_2024"
raw_data_dir: "../data/raw/bicol_kristine_2024"
interim_dir: "data_interim"
output_dir: "outputs"
shared_template_path: "../shared/grid_template.tif"
shared_water_mask_path: "../shared/water_mask.tif"

crs: "EPSG:32651"
resolution_m: 30.0

# [lon_min, lat_min, lon_max, lat_max] in EPSG:4326
inner_bbox_wgs84: [123.18, 13.58, 123.23, 13.63]
buffered_bbox_wgs84: [123.1430, 13.5441, 123.2670, 13.6659]
centroid_wgs84: [123.205, 13.605]

event_window:
  name: "Severe Tropical Storm Kristine (Trami)"
  event_start: "2024-10-21"
  event_end: "2024-10-26"
  prior7d_start: "2024-10-14"
  prior7d_end: "2024-10-21"
  smap_base30d_start: "2024-09-21"
  smap_base30d_end: "2024-10-21"
  smap_clim_baseline: "Oct 2021-2023"

terrain_params:
  slope_floor_deg: 0.1
  conditioning_method: "breach_depressions_fill_pits"

pooling_params:
  twi_percentile_min: 80.0
  elev_quartile_max: 25.0
  lowground_elev_max_m: 0.0
  depression_depth_min_m: 0.25

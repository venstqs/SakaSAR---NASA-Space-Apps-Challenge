<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SakaSAR — Typhoon flood simulation for Bicol farms</title>
  <meta name="description" content="3D replay of Typhoon Kristine over the Bicol Region: NASA rain and soil data, the storm track, Sentinel-1 flood mapping by town, and an LSTM forecast of waterlogged soil." />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SakaSAR — Agro-Hydrological Decision Support" />
  <meta property="og:description" content="Radar-based field drowning risk and crop-rotation guidance for typhoon-hit farms. Built for NASA Space Apps Challenge 2026." />
  <meta property="og:image" content="https://sakasar.vercel.app/assets/logo.png" />
  <meta property="og:url" content="https://sakasar.vercel.app" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="SakaSAR — Agro-Hydrological Decision Support" />
  <meta name="twitter:description" content="Radar-based field drowning risk and crop-rotation guidance for typhoon-hit farms." />
  <meta name="twitter:image" content="https://sakasar.vercel.app/assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The 3D map is the whole interface -->
  <div id="map" aria-label="3D map of the Bicol Region"></div>

  <header class="brand-bar">
    <img src="assets/sakasar-logo.png" alt="" width="38" height="38" />
    <div>
      <h1>SakaSAR</h1>
      <p>Typhoon Kristine over Bicol, October 2024</p>
    </div>
  </header>

  <!-- Dock: reopen windows -->
  <nav class="dock" id="dock" aria-label="Windows"></nav>

  <!-- ===== Windows (draggable, minimizable) ===== -->
  <section class="win" id="win-sim" data-title="Simulation" data-icon="play-circle" style="--x:50%;--y:calc(100% - 16px);--w:min(760px, calc(100vw - 32px))" data-anchor="bottom-center">
    <header class="win-head"><span class="win-title"><i data-lucide="play-circle"></i>Simulation</span><span class="win-ctl"></span></header>
    <div class="win-body sim">
      <div class="sim-row">
        <button type="button" class="play" id="btn-play" aria-label="Play"><i data-lucide="play"></i></button>
        <div class="sim-date"><b id="sim-date">2 Nov 2024</b><span id="sim-phase">After the storm</span></div>
        <div class="speed" role="group" aria-label="Speed">
          <button type="button" data-speed="1" aria-pressed="true">1×</button><button type="button" data-speed="2">2×</button><button type="button" data-speed="4">4×</button>
        </div>
      </div>
      <div class="sim-chart"><canvas id="ch-sim"></canvas></div>
      <input type="range" id="sim-slider" min="0" max="29" step="0.05" value="23" aria-label="Day" />
      <div class="sim-stats" id="sim-stats"></div>
    </div>
  </section>

  <section class="win" id="win-situation" data-title="Situation" data-icon="gauge" style="--x:16px;--y:84px;--w:316px">
    <header class="win-head"><span class="win-title"><i data-lucide="gauge"></i>Situation</span><span class="win-ctl"></span></header>
    <div class="win-body">
      <div class="kpis" id="kpis"></div>
      <h3 class="sub">Towns to reach first</h3>
      <p class="hint" id="towns-hint"></p>
      <label class="search"><i data-lucide="search"></i><input type="search" id="town-search" placeholder="Find a town" autocomplete="off" /></label>
      <ol class="towns" id="towns"></ol>
    </div>
  </section>

  <section class="win" id="win-layers" data-title="Layers" data-icon="layers" style="--x:calc(100% - 16px);--y:84px;--w:300px" data-anchor="right" data-start="min">
    <header class="win-head"><span class="win-title"><i data-lucide="layers"></i>Layers</span><span class="win-ctl"></span></header>
    <div class="win-body layers" id="layers"></div>
  </section>

  <section class="win" id="win-log" data-title="Event log" data-icon="list" style="--x:calc(100% - 16px);--y:470px;--w:300px" data-anchor="right">
    <header class="win-head"><span class="win-title"><i data-lucide="list"></i>Event log</span><span class="win-ctl"></span></header>
    <div class="win-body"><ol class="log" id="log"></ol></div>
  </section>

  <section class="win" id="win-ai" data-title="LSTM forecast" data-icon="brain-circuit" style="--x:16px;--y:calc(100% - 16px);--w:340px" data-anchor="bottom-left" data-start="min">
    <header class="win-head"><span class="win-title"><i data-lucide="brain-circuit"></i>LSTM forecast</span><span class="win-ctl"></span></header>
    <div class="win-body">
      <div class="seg" role="group" aria-label="Forecast" id="ai-seg">
        <button type="button" data-ai="hind" aria-pressed="true">After 2 Nov 2024</button>
        <button type="button" data-ai="again">Kristine again, today</button>
      </div>
      <p class="lead" id="ai-lead"></p>
      <div class="ai-chart"><canvas id="ch-ai"></canvas></div>
      <p class="hint" id="ai-hint"></p>
    </div>
  </section>

  <section class="win" id="win-town" data-title="Town" data-icon="map-pin" style="--x:372px;--y:84px;--w:320px" hidden>
    <header class="win-head"><span class="win-title"><i data-lucide="map-pin"></i><span id="town-title">Town</span></span><span class="win-ctl"></span></header>
    <div class="win-body" id="town-body"></div>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="SakaSAR">
  <!-- SakaSAR mark: satellite radar beam over field contour rings. Green disc, white strokes. -->
  <circle cx="60" cy="60" r="58" fill="#17643a"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- satellite -->
    <rect class="d" x="53" y="14" width="14" height="13" rx="3" stroke-width="3.2"/>
    <path class="d" d="M53 20.5H45M67 20.5H75" stroke-width="2.6"/>
    <rect class="d" x="27" y="16" width="18" height="9" rx="1.5" stroke-width="2.6"/>
    <rect class="d" x="75" y="16" width="18" height="9" rx="1.5" stroke-width="2.6"/>
    <path class="d" d="M33 16v9M39 16v9M81 16v9M87 16v9" stroke-width="1.6"/>
    <!-- radar beam arcs -->
    <path class="d" d="M52 37q8 4 16 0" stroke-width="3.2"/>
    <path class="d" d="M47 46q13 6 26 0" stroke-width="3.2"/>
    <path class="d" d="M42 55q18 7 36 0" stroke-width="3.2"/>
    <!-- horizon -->
    <path class="d" d="M8 72q52 -10 104 0" stroke-width="2.4"/>
    <!-- field contour rings -->
    <ellipse class="d" cx="60" cy="92" rx="36" ry="12" stroke-width="2.8"/>
    <ellipse class="d" cx="60" cy="92" rx="23" ry="7.5" stroke-width="2.8"/>
    <ellipse class="d" cx="60" cy="92" rx="11" ry="3.6" stroke-width="2.8"/>
    <circle cx="60" cy="92" r="2.6" fill="#ffffff" stroke="none"/>
  </g>
</svg>
